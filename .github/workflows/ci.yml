name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cognicortex
          POSTGRES_PASSWORD: cognicortex
          POSTGRES_DB: cognicortex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognicortex"
          --health-interval 2s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+psycopg://cognicortex:cognicortex@localhost:5432/cognicortex_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: pre-commit run --all-files

      - run: pytest

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - run: docker build .
